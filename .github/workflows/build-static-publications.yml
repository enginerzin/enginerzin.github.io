name: Build static publications once
on:
  push:
    branches: [static-publications]
    paths:
      - "scripts/build_static_publications.py"
      - ".github/workflows/build-static-publications.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: static-publications
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/build_static_publications.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/publications.json
          git diff --cached --quiet && exit 0
          git commit -m "Add static publication bibliography"
          git push origin HEAD:static-publications
