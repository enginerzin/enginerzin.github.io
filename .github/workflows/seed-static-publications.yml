name: Seed static publications
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seed-static-publications.yml"
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/build_static_publications.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/publications.json
          git commit -m "Add static publication bibliography"
          git push
